name: Build Vaab

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: vaab-linux-x86_64
          - os: macos-latest
            artifact: vaab-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vaab-cli

      - name: Build release binary
        run: cargo build -p vaab-cli --release

      - name: Smoke test
        run: |
          ./target/release/vaab version
          ./target/release/vaab run examples/01_hello.vaab

      - name: Stage named binary
        run: |
          mkdir -p dist
          cp target/release/vaab "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish latest release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: |
            Prebuilt `vaab` binaries from `master`.

            Install:
            ```sh
            curl -fsSL https://raw.githubusercontent.com/vaab-lang/vaab/master/install.sh | sh
            ```
          files: dist/*
          make_latest: true
          allow_updates: true
          fail_on_unmatched_files: true
