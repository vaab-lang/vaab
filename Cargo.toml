[workspace]
resolver = "2"
members = [
    "crates/vaab-syntax",
    "crates/vaab-types",
    "crates/vaab-vm",
    "crates/vaab-server",
    "crates/vaab-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vaab-lang/vaab"

[workspace.dependencies]
ariadne = "0.5"
indexmap = "2"
logos = "0.15"
serde_json = "1"
crossbeam-deque = "0.8"
thiserror = "2"
insta = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2.12"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
vaab-syntax = { path = "crates/vaab-syntax" }
vaab-types = { path = "crates/vaab-types" }
vaab-vm = { path = "crates/vaab-vm" }
vaab-server = { path = "crates/vaab-server" }

[profile.release]
lto = "thin"
